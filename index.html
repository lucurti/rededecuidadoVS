const RAMP = {"purple": {"bg": "#ECEBFA", "hd": "#6C63D9", "tx": "#fff"}, "teal": {"bg": "#E0F5F2", "hd": "#0ABAB5", "tx": "#fff"}, "coral": {"bg": "#FFEBDD", "hd": "#FF7A1A", "tx": "#fff"}, "pink": {"bg": "#FFE8EF", "hd": "#EC5C8A", "tx": "#fff"}, "gray": {"bg": "#EEF1F6", "hd": "#5B6B85", "tx": "#fff"}, "blue": {"bg": "#E3EBFA", "hd": "#12294D", "tx": "#fff"}, "green": {"bg": "#E8F5DC", "hd": "#5FA624", "tx": "#fff"}, "amber": {"bg": "#FFF1D6", "hd": "#F5A300", "tx": "#12294D"}, "red": {"bg": "#FFE6E3", "hd": "#E8553F", "tx": "#fff"}, "brown": {"bg": "#F3E7DC", "hd": "#8B5A2B", "tx": "#fff"}, "sky": {"bg": "#E1F0FF", "hd": "#2F80ED", "tx": "#fff"}};
const ROLE_ICON = {Padrinho:"ti-heart",JP:"ti-scale",Terapeuta:"ti-stethoscope",Orientador:"ti-notebook",Aluno:"ti-school",QT:"ti-stethoscope"};
function badge(txt,cor){ const c = RAMP[cor]||RAMP.gray; return '<span class="badge" style="background:'+c.bg+';color:'+(c.hd==='#F5A300'?'#8a5a00':c.hd)+'">'+txt+'</span>'; }
function personRow(p){ const t = p.turma ? p.turma : p.papel; return '<div class="row" onclick="selectPerson(\''+p.nome.replace(/'/g,"\\'")+'\')"><span>'+p.nome+'</span>'+badge(t,p.cor)+'</div>'; }
function renderList(items){ document.getElementById('list').innerHTML = items.slice(0,8).map(personRow).join(''); }
function duplaTxt(p,c){
  const al = DATA.find(x=>x.nome===c.nome && x.turma===c.turma);
  if(!al) return '';
  if(al.papel==='QT'){
    const par = c.papel_do_vinculo==='Terapeuta' ? ['Orientador','orientador'] : c.papel_do_vinculo==='Orientador' ? ['Terapeuta','terapeuta'] : null;
    if(!par) return '';
    const o = al.cuidadores.filter(x=>x[0]===par[0] && x[1]!==p.nome).map(x=>x[1]);
    return o.length ? ' <span class="dupla">('+par[1]+': '+o.join(' e ')+')</span>' : '';
  }
  const outros = al.cuidadores.filter(x=>x[0]===c.papel_do_vinculo && x[1]!==p.nome).map(x=>x[1]);
  if(!outros.length) return '';
  return ' <span class="dupla">(dupla com '+outros.join(' e ')+')</span>';
}
function roleLine(papel,nome){
  const icon = ROLE_ICON[papel]||'ti-user';
  return '<div class="link-line"><i class="ti '+icon+'"></i><span class="link-role">'+papel+'</span><span class="link-name">'+nome+'</span></div>';
}
function renderCard(p){
  const c = RAMP[p.cor]||RAMP.gray;
  const turmaTxt = p.turma ? (p.turma+' · '+p.fase) : p.papel;
  let html = '<div class="card" style="border-top:5px solid '+c.hd+'">';
  html += '<div class="card-head"><p class="card-name">'+p.nome+'</p>'+badge(turmaTxt,p.cor)+'</div>';
  html += '<p class="card-role">'+p.papel+'</p>';
  if(p.cuidadores.length){ html += '<p class="section-label">quem cuida de '+p.nome.split(' ')[0]+'</p>'; html += p.cuidadores.map(c=>roleLine(c[0],c[1])).join(''); }
  if(p.cuidados.length){ html += '<p class="section-label">quem '+p.nome.split(' ')[0]+' cuida</p>'; html += p.cuidados.map(c=>roleLine(c.papel_do_vinculo,c.nome+' ('+c.turma+')'+duplaTxt(p,c))).join(''); }
  if(!p.cuidadores.length && !p.cuidados.length){ html += '<p class="empty">nenhum vínculo registrado ainda</p>'; }
  html += '</div>';
  document.getElementById('card').innerHTML = html;
}
window.selectPerson = function(nome){
  const p = DATA.find(x=>x.nome===nome);
  document.getElementById('q').value = p.nome;
  document.getElementById('list').innerHTML = '';
  renderCard(p);
};
document.getElementById('q').addEventListener('input', function(e){
  const v = e.target.value.trim().toLowerCase();
  document.getElementById('card').innerHTML = '';
  if(v.length < 2){ document.getElementById('list').innerHTML=''; return; }
  const matches = DATA.filter(p=>p.nome.toLowerCase().includes(v));
  if(matches.length===1){ document.getElementById('list').innerHTML=''; renderCard(matches[0]); } else { renderList(matches); }
});
function renderTables(){
  let html = '';
  TABLES.forEach(function(t){
    const c = RAMP[t.cor]||RAMP.gray;
    html += '<div class="turma-block">';
    html += '<div class="turma-head" style="background:'+c.hd+';color:'+c.tx+'"><span>Turma '+t.turma+'</span><span class="th-r">fase '+t.fase+' · '+t.total+' pessoas</span></div>';
    html += '<table><thead><tr style="background:'+c.bg+'"><th style="color:'+c.tx+'">Nº</th><th style="color:'+c.tx+'">Aluno</th>' + t.headers.map(h=>'<th style="color:#12294D">'+h+'</th>').join('') + '</tr></thead><tbody>';
    t.rows.forEach(function(r, i){
      html += '<tr><td class="num">'+(i+1)+'</td><td class="aluno">'+r[0]+'</td>' + r.slice(1).map(v=>'<td>'+v+'</td>').join('') + '</tr>';
    });
    html += '</tbody></table></div>';
  });
  document.getElementById('tables').innerHTML = html;
}
renderTables();
</script>
</body>
</html>
